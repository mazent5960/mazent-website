    <script>
      (function () {
        try {
          var d = document.documentElement;
          if (localStorage.getItem("theme") === "dark") d.classList.add("dark");
          if (sessionStorage.getItem("mazent-welcome-seen")) d.classList.add("splash-seen");
          else { sessionStorage.setItem("mazent-welcome-seen", "1"); d.classList.add("splash-lock"); }
        } catch (e) {}
      })();
    </script>
